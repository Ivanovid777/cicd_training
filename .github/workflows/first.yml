# This is a basic workflow to help you get started with Actions

name: First test CI
run-name: "${{github.actor}} run this workflow"
env:
  GITHUB_ACTIONS: ${{github.action}}
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    types: opened
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  github-task-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Our variable is ${{env.GITHUB_ACTIONS}}"
      - run: echo "Branch name is ${{github.ref_name}} and repository name is ${{github.repository}}"
      - run: echo "Workflow is initialized by ${{github.event_name}} event"
